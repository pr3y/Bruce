; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

######################## Seeed Studio XIAO 1.47" Touch Display (ESP32-S3) #####################
; A display board for the XIAO series, sold mated to a XIAO ESP32-S3 Plus
; (ESP32-S3R8: 16MB flash, 8MB octal PSRAM) -- the generic esp32s3 JSON already
; matches that module (qio_opi / 80MHz), so only flash size and the partition
; table are overridden here.
;
; Plus-only: the board drives LCD RST/backlight and both user buttons on pads
; D17/D18/D19/D15, which a plain XIAO ESP32-S3 does not expose.
;
; Panel is a JD9853A 172x320 IPS on SPI, BGR, driven as an ST7796 -- see
; connections.md for why, for the full pin table, and for the rotation caveat.
;
; https://wiki.seeedstudio.com/getting_started_1.47_inch_touch_display_esp32s3/
[env:seeedstudio-esp32s3-touch-147]
board = esp32s3
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.speed = 921600

build_src_filter =${env.build_src_filter} +<../boards/seeedstudio-esp32s3-touch-147>
build_flags =
	${env.build_flags}
	-Iboards/seeedstudio-esp32s3-touch-147
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-D DEVICE_NAME='"Seeed XIAO 1.47 Touch"'
	-D BTN_ALIAS='"Ok"'

	-D ROTATION=3
	# AXS5106L touch controller. There is no TOUCH_CTRL_* case for this chip in
	# src/hal/inputs/touch.cpp, so the driver (one 14-byte register read) lives
	# in this board's interface.cpp instead.
	-D HAS_TOUCH=1

	-D HAS_2_BUTTONS=1
	-D BUTTONS_IDF_COMPONENT=1

	# 2-pin JST LiPo sensed on the XIAO's own ADC_BAT (GPIO10) through a
	# 316K/160K divider: (316+160)/160 = 2.975
	-D ANALOG_BAT_PIN=10
	-D ANALOG_BAT_MULTIPLIER=2.975f

	-D USE_ARDUINO_GFX=1
	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	# Arduino_ST7796, not Arduino_ST7789: this glass needs the BGR bit in
	# MADCTL, and only the ST7796 driver sets it. Its init table is one of the
	# two Seeed documents as known-working on the JD9853A.
	-D TFT_DISPLAY_DRIVER_N=2
	-D TFT_WIDTH=172
	-D TFT_HEIGHT=320
	-D TFT_CS=3
	-D TFT_DC=4
	-D TFT_RST=13   # shared with the touch controller's RST
	-D TFT_MISO=8   # not used by the panel, shared bus with the SD card
	-D TFT_MOSI=9
	-D TFT_SCLK=7
	-D TFT_BL=12
	-D TFT_IPS=0    # JD9853A glass reads normal with inversion OFF
	# 172 of a 240-wide controller RAM, centred: (240-172)/2 = 34. OFS1 is used
	# at rotation 0, OFS2 at 1/2/3.
	-D TFT_COL_OFS1=34
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=34
	-D TFT_ROW_OFS2=0
	-D TFT_PREF_SPEED=40000000

	# microSD shares the panel's SPI bus; setupSdCard() picks the display's own
	# SPI instance up through acquireSPIBus() because the pins match.
	-D SDCARD_CS=43
	-D SDCARD_SCK=7
	-D SDCARD_MISO=8
	-D SDCARD_MOSI=9

; Arduino_GFX, pinned to the same commit bmorcelli's Launcher builds these
; boards against (it carries his own merged PRs, e.g. the RGB cache work).
lib_deps =
	${env.lib_deps}
	https://github.com/moononournation/Arduino_GFX.git#2ef1b8f958818b4cba66728df4c2f78bb77f0321
